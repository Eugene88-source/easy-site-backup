# Тести: синтаксис і ZIP — на кількох версіях PHP, інтеграційні — на справжньому WordPress з MySQL.
# Викликається також із release.yml: реліз публікується лише після успішних тестів.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit:
    name: Lint + unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: ZIP reader and writer
        run: php tests/unit/zip.php

  integration:
    name: WordPress (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_PATH: ${{ github.workspace }}/../wordpress
      WP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          wp core download --path="$WP_PATH"
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          # Без WP-Cron-запитів до однопотокового вбудованого сервера PHP.
          wp config set DISABLE_WP_CRON true --raw --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url="$WP_URL" --title=Test --admin_user=admin \
            --admin_password=admin --admin_email=admin@example.com --skip-email
          # Плагін — так само, як у пакеті релізу (git archive, без тестів і .github).
          mkdir "$WP_PATH/wp-content/plugins/easy-site-backup"
          git archive HEAD | tar -x -C "$WP_PATH/wp-content/plugins/easy-site-backup"
          wp plugin activate easy-site-backup --path="$WP_PATH"

      - name: Start web server
        run: |
          php -S 127.0.0.1:8080 -t "$WP_PATH" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null "$WP_URL/" && break; sleep 1; done

      - name: Admin page
        run: php tests/integration/admin-page.php "$WP_PATH"

      - name: Free space checks
        run: php tests/integration/space.php "$WP_PATH"

      - name: Schedule
        run: php tests/integration/schedule.php "$WP_PATH"

      - name: Updater
        run: php tests/integration/updater.php "$WP_PATH"

      - name: Storage exposure check
        run: php tests/integration/storage.php "$WP_PATH"

      - name: Backup and restore
        run: php tests/integration/backup-restore.php "$WP_PATH"

      - name: Download whole and in parts
        run: php tests/integration/download.php "$WP_PATH"

      - name: Upload and restore from file
        run: php tests/integration/upload.php "$WP_PATH"

      - name: Dump parts, large files in parts, legacy archive
        run: php tests/integration/chunked.php "$WP_PATH"

      - name: Killed steps (backup and restore continue, data identical)
        run: php tests/integration/interrupt.php "$WP_PATH"

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
